const RX=[[/^Halo, /,'Hello, '],[/^Deadline (.+), sisa (.+)[.]$/,'Due $1, $2 left.'],[/^([0-9]+) tugas berisiko tinggi[.] Buka Rescue.*$/,'$1 task(s) at high risk. Open Rescue to see how to adjust your plan.'],[/^Prioritas utama: (.*)[.] Mulai paling lambat (.*)[.]$/,'Top priority: $1. Start no later than $2.'],[/^Kapasitasmu (.+) per hari, sesi terbaik di ([a-z]+)[.]$/,(m,a,b)=>`Your capacity is ${a} per day; your best study time is ${W[b]||b}.`],[/sisa ([0-9.,]+ h)/,'$1 left'],[/([0-9]+)% selesai/,'$1% done'],[/^([0-9]+)% keseluruhan$/,'$1% overall'],[/^(.+ h) dari (.+ h) estimasi sudah dikerjakan[.]$/,'$1 of $2 estimated work is done.'],[/^Tahapan dijadwalkan mundur dari deadline, dengan jeda aman ([0-9]+) hari[.]$/,'Stages are scheduled backwards from the deadline, with a $1-day safety buffer.'],[/ · (.+ h) total · kapasitas (.+)[/]hari$/,' · $1 total · capacity $2/day'],[/^Mulai riset seharusnya (.+)[.] Buka Rescue untuk strategi pengejaran[.]$/,'Research should have started on $1. Open Rescue for a catch-up strategy.'],[/^Sudah lewat ([0-9]+) hari[.]$/,'Overdue by $1 days.'],[/^Kapasitas kurang (.+)[.] Tambah ±(.+) per hari sampai deadline [(]jadi (.+)[/]hari[)][.]$/,'You are short by $1. Add about $2 per day until the deadline (to $3/day).'],[/^Atau kecilkan cakupan sekitar ([0-9]+)% dan pertahankan inti penilaian[.]$/,'Or reduce the scope by about $1% and keep the core graded parts.'],[/^Beban masih muat, tapi tipis[.] Mulai hari ini, (.+) di sesi ([a-z]+)[.]$/,(m,a,b)=>`The load still fits, but it is tight. Start today with ${a} in your ${W[b]||b} session.`],[/^Tunda dulu: (.+) [(]kepentingan rendah, risikonya masih aman[)][.]$/,'Postpone for now: $1 (low importance, the risk is still low).'],[/^Progres (.+)$/,'Progress: $1']];
function tr(s){if(L!='en')return s;const k=s.trim();if(k in EX)return s.replace(k,EX[k]);let r=s;for(const[a,b]of RX)r=r.replace(a,b);return r}
function applyLang(){document.documentElement.lang=L;const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentNode.closest('script,style')?2:1});let n;while(n=w.nextNode()){if(n.__o===undefined)n.__o=n.data;const v=tr(n.__o);if(n.data!==v)n.data=v}

async function doAuth(){const U=users(),m=a_e.value.trim().toLowerCase(),p=a_p.value,msg=x=>{$('#a_m').textContent=tr(x)};
if(!/^\S+@\S+\.\S+$/.test(m))return msg('Masukkan email yang valid.');if(p.length<6)return msg('Kata sandi minimal 6 karakter.');
const h=await hash(p);
if(reg){if(!a_n.value.trim())return msg('Isi nama lengkapmu.');if(U[m])return msg('Email sudah terdaftar. Silakan masuk.');U[m]={name:a_n.value.trim(),level:a_l.value,h};try{localStorage.setItem(UK,JSON.stringify(U))}catch(x){return msg('Penyimpanan browser tidak tersedia.')}}
else if(!U[m]||U[m].h!==h)return msg('Email atau kata sandi salah.');
try{localStorage.setItem(SK,m)}catch(x){}a_p.value='';start(m)}

if(!seedDemo)return;
const t=(a,b,c,d,p,i)=>({id:++S.id,title:a,course:b,due:add(TODAY,c),est:d,progress:p,imp:i});

function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}}
// ===== Smart Workload Analysis =====
function analyze(){const cap=+S.prefs.hours||1;
const act=S.tasks.filter(t=>t.progress<100).map(t=>({t,rem:t.est*(1-t.progress/100),d:Math.max(0,dd(t.due)),over:dd(t.due)<0})).sort((a,b)=>a.d-b.d||b.t.imp-a.t.imp);
const free=Array(Math.max(0,...act.map(a=>a.d))+1).fill(cap);
act.forEach(a=>{let r=a.rem;a.today=0;for(let i=0;i<=a.d&&r>.001;i++){const u=Math.min(free[i],r);free[i]-=u;r-=u;if(i==0)a.today=u}
a.short=r;a.ratio=a.rem/(cap*(a.d+1));a.risk=(a.short>.01||a.over)?3:a.ratio>.6?2:a.ratio>.3?1:0;
a.score=Math.round(a.ratio*60+a.t.imp*8+(a.risk==3?40:0)+Math.max(0,10-a.d*2));
a.start=add(a.t.due,-(Math.ceil(a.rem/cap)-1)-S.prefs.buffer)});
return act.sort((a,b)=>b.score-a.score)}
const when=d=>L=='en'?(d<0?`${-d} days late`:d==0?'today':d==1?'tomorrow':`in ${d} days`):(d<0?`terlambat ${-d} hari`:d==0?'hari ini':d==1?'besok':`${d} hari lagi`);
const pill=r=>`<span class="pill k${r}">${T('Risiko ','Risk ')}${[T('Rendah','Low'),T('Sedang','Medium'),T('Tinggi','High'),T('Kritis','Critical')][r]}</span>`;
const H=h=>{const n=(Math.round(h*10)/10).toString();return L=='en'?n+' h':n.replace('.',',')+' jam'};

const V={
dash(){const A=analyze(),done=S.tasks.filter(t=>t.progress>=100).length,hi=A.filter(a=>a.risk>=2).length,load=A.reduce((s,a)=>s+a.rem,0),foc=A.filter(a=>a.today>0);
const top=A[0];
return hd(`Halo, ${e(S.prefs.name)}`,'Ringkasan beban akademikmu hari ini.',addBtn)+
`<div class="card hero" style="margin-bottom:14px;position:relative"><svg class="mas" style="position:absolute;right:14px;top:50%;margin-top:-30px"><use href="#logo"/></svg><h3>${top?(top.risk>=2?'Ada tugas yang perlu diselamatkan':'Semua tugas masih terkendali'):'Belum ada tugas aktif'}</h3><p>${top?(top.risk>=2?`${hi} tugas berisiko tinggi. Buka Rescue untuk melihat langkah penyesuaian.`:`Prioritas utama: ${e(top.t.title)}. Mulai paling lambat ${fd(top.start)}.`):'Tambahkan tugas pertamamu untuk mulai dianalisis.'}</p></div>
<div class="grid g4" style="margin-bottom:14px"><div class="card st"><b>${A.length}</b><span>Tugas aktif</span></div><div class="card st"><b>${H(load)}</b><span>Total sisa pengerjaan</span></div><div class="card st"><b style="color:${hi?'var(--bd)':'var(--ok)'}">${hi}</b><span>Berisiko tinggi</span></div><div class="card st"><b>${done}</b><span>Tugas selesai</span></div></div>
<div class="grid g2"><div class="card"><h3>Prioritas tugas</h3>${A.slice(0,5).map(a=>taskRow(a)).join('')||'<div class="empty">Tidak ada tugas aktif.</div>'}</div>
<div class="card"><h3>Fokus hari ini</h3><p style="color:var(--mu);margin:4px 0">Kapasitasmu ${H(S.prefs.hours)} per hari, sesi terbaik di ${e(S.prefs.time)}.</p>${foc.map(a=>`<div class="row"><div class="m"><b>${e(a.t.title)}</b><small>${e(a.t.course)}</small></div><b>${H(a.today)}</b></div>`).join('')||'<div class="empty">Tidak ada yang mendesak hari ini.</div>'}</div></div>`},
tasks(){const A=analyze(),m=Object.fromEntries(A.map(a=>[a.t.id,a]));

function forecastWeek(){
 const cap=Math.max(.5,+S.prefs.hours||1);
 const days=Array.from({length:7},(_,i)=>({date:add(TODAY,i),hours:0,tasks:[]}));
 const active=S.tasks.filter(t=>t.progress<100).map(t=>({t,rem:Math.max(0,(+t.est||0)*(1-Math.max(0,Math.min(100,+t.progress||0))/100)),due:dd(t.due)})).sort((a,b)=>a.due-b.due||(+b.t.imp||2)-(+a.t.imp||2));
 active.forEach(a=>{
  let remaining=a.rem;
  const last=Math.max(0,Math.min(6,Number.isFinite(a.due)?a.due:6));
  for(let i=0;i<=last&&remaining>.001;i++){
   const used=Math.min(Math.max(0,cap-days[i].hours),remaining);
   if(used>.001){days[i].hours+=used;days[i].tasks.push({id:a.t.id,title:a.t.title,hours:used});remaining-=used;}
  }
 });
 return {cap,days,planned:days.reduce((n,d)=>n+d.hours,0)};
}
function dashboardBuddy(risk,active,done,total){
 const pose=total>0&&done===total?9:risk>=3?14:risk>=2?5:active?4:1;
 const label=total>0&&done===total?T('Misi selesai','Mission complete'):risk>=3?T('Sedang menyusun strategi','Thinking through a plan'):risk>=2?T('Ayo atur ulang ritme','Let’s reset the rhythm'):active?T('Temani sesi belajarmu','Here for your study session'):T('Siap menemani','Ready to help');
 return `<div class='dash-buddy'><img src='/mascots/mascot-${String(pose).padStart(2,'0')}.svg' alt='${label}'><span>${label}</span></div>`;
}

 const bars=week.days.map((d,i)=>{const pct=Math.min(100,Math.round(d.hours/week.cap*100)),tone=pct>=85?'high':pct>=55?'mid':'low',label=i===0?T('Hari ini','Today'):pd(d.date).toLocaleDateString(L==='en'?'en-US':'id-ID',{weekday:'short'});return `<div class='week-col ${i===0?'today':''}' title='${label}: ${H(d.hours)} / ${H(week.cap)}'><div class='week-value'>${d.hours>.05?H(d.hours):'–'}</div><div class='week-track'><i class='week-fill ${tone}' style='height:${pct}%'></i></div><span>${label}</span></div>`}).join('');

 `<section class='dash-hero card'><div class='dash-hero-copy'><span class='dash-eyebrow'>${T('RINGKASAN HARI INI','TODAY AT A GLANCE')}</span><h3>${statusTitle}</h3><p>${e(statusText)}</p><div class='dash-actions'><button class='btn s' onclick='go("rescue")'>${ic('bolt')}${T('Buka Rescue','Open Rescue')}</button><button class='btn g s' onclick='go("plan")'>${ic('route')}${T('Lihat Planner','Open Planner')}</button></div></div>${dashboardBuddy(critical?3:hi?2:0,active,done,total)}</section>`+
 `<div class='grid g4 dash-stats'><div class='card st'><b>${active}</b><span>${T('Tugas aktif','Active tasks')}</span></div><div class='card st'><b>${H(load)}</b><span>${T('Sisa pengerjaan','Work remaining')}</span></div><div class='card st'><b style='color:${hi?'var(--bd)':'var(--ok)'}'>${hi}</b><span>${T('Perlu perhatian','Need attention')}</span></div><div class='card st'><b>${done}/${total}</b><span>${T('Tugas selesai','Tasks completed')}</span></div></div>`+
 `<div class='dash-grid'><section class='card week-card'><div class='dash-section-head'><div><h3>${T('Beban 7 hari ke depan','Next 7 days workload')}</h3><p>${T('Proyeksi memakai kapasitas harian dari profilmu.','Forecast based on the daily capacity in your profile.')}</p></div><button class='btn g s' onclick='go("cal")'>${T('Kalender','Calendar')}</button></div><div class='week-bars'>${bars}</div><div class='week-legend'><span><i></i>${T('Estimasi beban','Projected workload')}</span><b>${H(week.planned)} / ${H(week.cap*7)} ${T('kapasitas mingguan','weekly capacity')}</b></div><p class='week-note ${nearShort>.01?'warning':''}'>${nearShort>.01?T(`${H(nearShort)} belum tertampung sebelum deadline terdekat.`,`${H(nearShort)} still cannot fit before the nearest deadlines.`):T('Tidak ada kekurangan kapasitas pada deadline 7 hari ke depan.','No capacity shortfall for deadlines in the next 7 days.')}</p></section>`+
 `<section class='card focus-card'><div class='dash-section-head'><div><h3>${T('Fokus hari ini','Today’s focus')}</h3><p>${T(`Kapasitas belajar ${H(week.cap)} per hari · sesi ${studyTime}.`,`Study capacity ${H(week.cap)} per day · ${studyTime} session.`)}</p></div></div>${focus.map(a=>`<div class='focus-row'><div class='focus-dot'></div><div class='focus-copy'><b>${e(a.t.title)}</b><small>${e(a.t.course||T('Tanpa mata pelajaran','No subject'))} · ${T('deadline','due')} ${when(dd(a.t.due))}</small></div><strong>${H(a.today)}</strong></div>`).join('')||`<div class='empty dash-empty'>${T('Belum ada sesi yang perlu dijadwalkan hari ini.','No study sessions need scheduling today.')}</div>`}<button class='text-action' onclick='go("plan")'>${T('Atur sesi di Planner','Arrange sessions in Planner')} →</button></section>`+
 `<section class='card upcoming-card'><div class='dash-section-head'><div><h3>${T('Deadline terdekat','Upcoming deadlines')}</h3><p>${T('Tugas yang jatuh tempo dalam 7 hari.','Tasks due within the next 7 days.')}</p></div><button class='btn g s' onclick='go("tasks")'>${T('Semua tugas','All tasks')}</button></div>${urgent.map(a=>`<div class='upcoming-row' data-pid='${a.t.id}'><div class='upcoming-date'><b>${pd(a.t.due).getDate()}</b><small>${pd(a.t.due).toLocaleDateString(L==='en'?'en-US':'id-ID',{month:'short'})}</small></div><div class='focus-copy'><b>${e(a.t.title)}</b><small>${e(a.t.course||T('Tanpa mata pelajaran','No subject'))} · ${when(dd(a.t.due))}</small></div>${pill(a.risk)}</div>`).join('')||`<div class='empty dash-empty'>${T('Tidak ada deadline dalam 7 hari ke depan.','No deadlines in the next 7 days.')}</div>`}</section>`+
 `<section class='card completion-card'><div class='dash-section-head'><div><h3>${T('Konsistensi progres','Progress overview')}</h3><p>${T('Persentase berdasarkan jumlah tugas yang selesai.','Percentage based on completed task count.')}</p></div><b class='completion-value'>${completion}%</b></div><div class='bar completion-bar'><i style='width:${completion}%'></i></div><div class='completion-meta'><span>${done} ${T('selesai','completed')}</span><span>${Math.max(0,total-done)} ${T('tersisa','remaining')}</span></div><button class='text-action' onclick='go("prog")'>${T('Lihat detail progres','View progress details')} →</button></section></div>`;
};

function paintSy(){const s=$('#sy');if(!s)return;s.className='sy '+syncSt;s.textContent={ok:T('Tersinkron','Synced'),sync:T('Menyinkronkan…','Syncing…'),off:T('Offline, disimpan di perangkat','Offline, saved on device'),local:T('Mode lokal','Local mode')}[syncSt];s.title=cloud?T('Klik untuk sinkronkan sekarang','Click to sync now'):T('Data hanya tersimpan di perangkat ini','Data stays on this device only')}

function merge(R){const D={...(R.del||{})};Object.entries(S.del||{}).forEach(([k,v])=>{D[k]=Math.max(v,D[k]||0)});const M={};[...(R.tasks||[]),...S.tasks].forEach(t=>{const o=M[t.id];if(!o||(t.u||0)>(o.u||0))M[t.id]=t});S.tasks=Object.values(M).filter(t=>!(D[t.id]>(t.u||0))).sort((a,b)=>a.id-b.id);S.del=D;if((R.pu||0)>(S.pu||0)){S.prefs={...S.prefs,...R.prefs};S.pu=R.pu}resnap()}
const queue=()=>{clearTimeout(pend);pend=setTimeout(push,1200)},dirtyNow=()=>{stamp();return JSON.stringify(S)!==lastJ};
